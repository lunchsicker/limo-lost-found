# Parameters for the limo_llm node. llm.launch.py also passes `objects` to the DEBUG mock
# executor. (No `/**` section: launch arguments are passed as `/**` and must win.)
# Paths left empty here use the installed defaults:
#   robot_api_file / search_locations_file -> limo_policy.paths
#   ($LIMO_CONFIG_DIR, else share/limo_policy/config, else the repository config/)
#   prompts_dir -> share/limo_llm/prompts
limo_llm:
  ros__parameters:
    # Searchable objects = detector (COCO) class names. The LLM maps the user's words to
    # these. Other objects are still searched and reported as not found if never seen.
    objects: [handbag, umbrella, cup, cell phone, book]
    provider: openai              # openai | mock
    model_name: gpt-4o-mini       # must support `stop` sequences (CaP stop tokens)
    openai_api_key: ''            # empty -> $OPENAI_API_KEY
    temperature: 0.0              # CaP uses temperature 0
    max_tokens: 512
    request_timeout: 30.0
    max_attempts: 2               # 1 = no regeneration after a rejected policy
    max_fgen_depth: 0             # 0 -> robot_api.yaml grammar.limits
    max_helper_functions: 0       # 0 -> robot_api.yaml grammar.limits
    maintain_session: false
    output_mode: debug_topic      # debug_topic | action | none
    execute_policy_action: /limo_executor/execute_policy
