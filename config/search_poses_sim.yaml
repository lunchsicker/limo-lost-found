# Search location poses for the Webots world (webots_ros2_limo/worlds/limo_world.wbt).
#
# Consumer: limo_executor (goto_loc resolves a location name to this pose).
# limo_llm never reads this file: the LLM only sees the names in search_locations_sim.yaml.
# The names here must match search_locations_sim.yaml exactly.
#
# Frame: Nav2 `map` of webots_ros2_limo/resource/limo_world_map.yaml.
#   map = world - (6.36, 0), no rotation (robot spawn = map origin, AMCL initial pose 0,0,0).
#   Verified 2026-11-08 by matching the wall lines of the map image to the world walls
#   (within one 0.05 m cell).
# pose: [x, y, yaw_deg]; yaw 0 = +x, counter-clockwise positive; the robot faces `look_at`.
#
# How the poses were chosen (2026-11-08):
#   * free map cell reachable from the start, >= 0.5 m from obstacles (robot_radius 0.18),
#     furniture footprints treated as solid even where the lidar sees under them (sofa)
#   * unobstructed line of sight to `look_at`, 0.7-1.3 m away (depth camera range 0.3-3 m)
#   * each pose was driven to with Nav2 NavigateToPose in Webots (diff drive, default
#     nav2_params, use_rviz:=false): all SUCCEEDED, final AMCL position error 0.05-0.09 m.
#     controller_server logged "Failed to make progress" twice during the run; the goals
#     still succeeded after recovery.
# NOT verified: what the camera actually sees from each pose, and the armchair's front side.

frame_id: map
environment: sim
poses:
  fridge:
    pose: [0.25, 3.70, 145.0]
    look_at: [-0.64, 4.32]      # fridge front face (world fridge at 5.70, 4.64)
    nav2_check: {result: SUCCEEDED, time_s: 25.9, position_error_m: 0.05}
  cardboard_boxes:
    pose: [2.10, 3.50, 32.0]
    look_at: [2.90, 4.00]       # box stack in the north-east corner
    nav2_check: {result: SUCCEEDED, time_s: 16.9, position_error_m: 0.06}
  armchair:
    pose: [0.00, 0.95, 0.0]
    look_at: [0.71, 0.94]       # west side of the armchair (front side not confirmed)
    nav2_check: {result: SUCCEEDED, time_s: 30.1, position_error_m: 0.07}
  sofa:
    pose: [1.65, -1.70, 68.0]
    look_at: [2.12, -0.52]      # sofa seat (faces west); table blocks a straight front view
    nav2_check: {result: SUCCEEDED, time_s: 23.4, position_error_m: 0.09}
  cabinet:
    pose: [1.75, -2.50, 0.0]
    look_at: [2.60, -2.50]      # cabinet front face (faces west)
    nav2_check: {result: SUCCEEDED, time_s: 15.7, position_error_m: 0.08}
  door:
    pose: [-0.40, -1.50, 180.0]
    look_at: [-1.30, -1.50]     # doorway in the west wall
    nav2_check: {result: SUCCEEDED, time_s: 18.0, position_error_m: 0.09}
  # Not a search location; the robot spawn / home pose.
  start:
    pose: [0.0, 0.0, 0.0]
    nav2_check: {result: SUCCEEDED, time_s: 13.5, position_error_m: 0.05}
