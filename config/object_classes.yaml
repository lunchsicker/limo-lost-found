# Search target catalog: user words (Korean) -> canonical name -> detector classes.
#
# Shared by:
#   * limo_llm        - canonical names go into the prompt; Korean aliases are shown to the
#                       LLM and used for a consistency warning
#   * limo_perception - maps a canonical name to the class names of the real detector
#   * limo_executor   - get_known_objects() returns the canonical names
#
# IMPORTANT: no detector has been chosen or tested yet. `detector_classes` lists
# CANDIDATE class names from the COCO-80 label set (used by most YOLO checkpoints), for
# reference only. `verified: false` means nobody has confirmed that the deployed model
# outputs this class or detects it reliably. The perception owner must fill in the real
# class names and set verified: true.

catalog_version: '0.1.0'

detector:
  name: UNCONFIRMED          # e.g. "yolov8n (COCO-80)" once chosen by limo_perception
  label_set: COCO-80 (candidate, not verified)
  verified: false

objects:
  bag:
    aliases_ko: [가방, 백팩, 핸드백]
    aliases_en: [bag, backpack, handbag]
    # COCO-80 has no plain "bag" class.
    detector_classes: [backpack, handbag, suitcase]
    verified: false
  umbrella:
    aliases_ko: [우산]
    aliases_en: [umbrella]
    detector_classes: [umbrella]
    verified: false
  cup:
    aliases_ko: [컵, 머그컵, 텀블러]
    aliases_en: [cup, mug]
    detector_classes: [cup]
    verified: false
  cell phone:
    aliases_ko: [휴대폰, 핸드폰, 스마트폰, 휴대전화, 폰]
    aliases_en: [cell phone, phone, smartphone, mobile phone]
    detector_classes: [cell phone]
    verified: false
  book:
    aliases_ko: [책, 공책, 노트]
    aliases_en: [book, notebook]
    detector_classes: [book]
    verified: false
